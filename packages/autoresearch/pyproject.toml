[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhi-autoresearch"
version = "0.1.0"
description = "Evidence-based research agent service for ShenZhi"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "numpy>=2,<3", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
forecast = ["torch==2.8.0"]

[project.scripts]
shenzhi-ar = "autoresearch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["web/*", "web/lib/*", "web/views/*", "web/handoff/*", "web/evidence/*/*", "web/records/*/*", "runner/*", "assets/dlinear/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
