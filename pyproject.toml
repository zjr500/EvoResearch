[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evoresearch"
version = "0.7.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "shenzhi-autoresearch==0.1.0", "mlflow==3.5.1", "graphiti-core==0.31.2", "fastembed==0.7.3", "psutil==7.2.2", "pypdf==6.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
forecast = ["torch==2.8.0"]

[project.scripts]
evoresearch = "evoresearch.__main__:main"

[tool.setuptools]
packages = ["evoresearch", "contracts"]
package-dir = {evoresearch = "services/research/src/evoresearch", contracts = "contracts"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/research/src", "packages/autoresearch/src", "apps/workbench"]
addopts = "--import-mode=importlib"
