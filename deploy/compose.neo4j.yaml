services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${GRAPHITI_PASSWORD:?Set GRAPHITI_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - graphiti-data:/data
volumes:
  graphiti-data:
