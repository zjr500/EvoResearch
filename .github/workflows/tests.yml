name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-lock.txt setuptools wheel
      - run: pip install --no-deps --no-build-isolation -e packages/autoresearch -e .
      - run: python scripts/test.py
